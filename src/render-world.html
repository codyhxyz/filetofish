<title>filetofish &#183; Water lab</title>
<style>
:root{color-scheme:dark;--bg:#07181d;--panel:#0b242a;--ink:#eaf7f7;--dim:#b5cdcf;--line:#315159;--accent:#ffc49a;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Futura,"Avenir Next",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button,select{min-height:44px;background:var(--panel);border:1px solid var(--line);padding:.5rem .8rem;cursor:pointer}
button:hover,a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--bg)}
.wrap{max-width:80rem;margin:auto;padding:clamp(1rem,3vw,2.5rem)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
h1{margin:0;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:500;letter-spacing:-.025em}
a{color:var(--dim);text-underline-offset:.3em}
.lede{color:var(--dim);font-size:.9rem;line-height:1.6;margin:.5rem 0 0;max-width:65ch}
canvas{display:block;width:100%;height:clamp(18rem,52vw,38rem);background:#122a37}
.controls{background:var(--panel);padding:1.2rem}
.topline{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}
.buttons{display:flex;gap:.5rem;margin-left:auto}
.sliders{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1.5rem}
.slider-head{display:flex;justify-content:space-between;gap:.75rem;font-size:.85rem}
output{font:.8rem var(--mono);font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{display:block;width:100%;height:44px;margin:0;accent-color:var(--accent);cursor:ew-resize}
.hint{display:block;color:var(--dim);font-size:.8rem;line-height:1.5}
@media(max-width:640px){.sliders{grid-template-columns:1fr;gap:.75rem}.buttons{margin-left:0}}
</style>
<main class="wrap">
  <header>
    <div><h1>Water lab</h1><p class="lede">Three.js Water and Sky. Scrub time in either direction: the sun and its reflection use the same light position.</p></div>
    <a href="/">Back to fishing</a>
  </header>
  <canvas id="preview" aria-label="Three.js ocean preview"></canvas>
  <section class="controls" aria-label="Ocean preview controls">
    <div class="topline">
      <label for="weather">Weather</label>
      <select id="weather">
        <option value="auto">Follow time</option><option value="dawn">Dawn</option>
        <option value="sunrise">Sunrise</option><option value="day">Clear</option>
        <option value="dusk">Dusk</option><option value="night">Night</option>
        <option value="fog">Fog</option><option value="rain">Rain</option>
      </select>
      <div class="buttons">
        <button id="pause" type="button" aria-pressed="false">Pause</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </div>
    <div class="sliders">
      <div>
        <div class="slider-head"><label for="time">Time of day</label><output id="time-v" for="time">07:30</output></div>
        <input id="time" type="range" min="0" max="1439" value="450">
        <span class="hint">Moving time clears the weather override.</span>
      </div>
      <div>
        <div class="slider-head"><label for="waves">Surface distortion</label><output id="waves-v" for="waves">100%</output></div>
        <input id="waves" type="range" min="0" max="200" value="100">
        <span class="hint">The Water add-on's reflection distortion, not wave height.</span>
      </div>
      <div>
        <div class="slider-head"><label for="zoom">Zoom</label><output id="zoom-v" for="zoom">100%</output></div>
        <input id="zoom" type="range" min="100" max="300" value="100">
      </div>
    </div>
  </section>
</main>
<!--APP_BUNDLE-->
