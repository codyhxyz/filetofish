<title>filetofish</title>

<style>
:root{
  --f-display:Futura,"Futura PT","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --ink:#F2FAFB;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; overflow:hidden; background:#7EC8E3; color:var(--ink);
  font-family:var(--f-display); -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
canvas{display:block;}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0;}
:focus-visible{outline:2px solid #FFD9A8; outline-offset:4px;}

#world{position:fixed; inset:0; z-index:0; will-change:transform;}
#sea,#fish{position:fixed; inset:0; width:100%; height:100%;}
#sea{z-index:0;}
/* aliased on purpose: the rod should read as the same chunky material as the
   pixel-diced fish, not as smooth vector art sitting on top of it */
#rig{position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none;
  shape-rendering:crispEdges;}
#fish{z-index:2; pointer-events:none;}

/* dims the world when a specimen is on screen */
#veil{
  position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0;
  transition:opacity .5s ease;
  background:radial-gradient(ellipse at 50% 44%, rgba(5,26,33,.30) 0%, rgba(4,20,26,.64) 68%);
}
body.has-catch #veil{opacity:1;}
#flash{
  position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0;
  background:radial-gradient(ellipse at 50% 40%, var(--rar,#fff) 0%, transparent 60%);
}
body.rar-flash #flash{animation:rarflash .8s ease-out;}
@keyframes rarflash{0%{opacity:0}14%{opacity:.40}100%{opacity:0}}
#rig{transition:opacity .5s ease;}
body.has-catch #rig{opacity:.22;}

#hit{position:fixed; inset:0; z-index:3; cursor:pointer;}
#hit.fish-hover{cursor:grab;}
#hit.fish-drag{cursor:grabbing;}

.mark{
  position:fixed; left:clamp(1.1rem,3vw,2.2rem); top:clamp(1rem,2.6vw,1.9rem); z-index:5;
  font-size:clamp(1.15rem,2vw,1.5rem); letter-spacing:-.02em; line-height:1;
  text-shadow:0 2px 12px rgba(4,30,40,.55); pointer-events:none;
}
.mark i{font-style:normal; color:#FFD9A8;}

/* the catch record: name, rarity, and the file it came from */
#plate{
  position:fixed; left:50%; bottom:clamp(4.4rem,10vh,7rem); transform:translate(-50%,10px);
  z-index:5; text-align:center; opacity:0; transition:opacity .45s ease, transform .45s ease;
  pointer-events:none; width:min(92vw,34rem);
}
body.has-catch #plate{opacity:1; transform:translate(-50%,0);}
#plate .rar{
  font-family:var(--f-mono); font-size:.6rem; letter-spacing:.26em; text-transform:uppercase;
  color:#FFC49A; text-shadow:0 1px 8px rgba(4,30,40,.8);
}
#plate .nm{
  font-size:clamp(1.9rem,5.2vw,3.1rem); line-height:1.04; margin-top:.28rem; letter-spacing:-.02em;
  text-shadow:0 3px 18px rgba(4,30,40,.7); text-wrap:balance;
}
#plate .sub{
  font-family:var(--f-mono); font-size:.7rem; letter-spacing:.1em; margin-top:.5rem;
  color:rgba(238,250,252,.78); text-shadow:0 1px 10px rgba(4,30,40,.9);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* The three ends a fish can come to. They are deliberately the same size and the
   same material: ranking them primary / secondary / ghost would be the interface
   answering a question that belongs to the player. They differ in character
   instead -- quiet, bright, warm -- and each one says its own price out loud,
   because a trade you cannot see is not a trade. */
#plate .acts{
  display:flex; gap:clamp(.35rem,2.4vw,1.1rem); justify-content:center; align-items:flex-start;
  margin-top:1.05rem; pointer-events:auto;
}
#plate .acts .act{
  display:flex; flex-direction:column; align-items:center; gap:.55rem;
  width:clamp(5.4rem,28vw,9.2rem); text-align:center;
  opacity:0; transform:translateY(10px);
  transition:opacity .36s ease, transform .36s cubic-bezier(.16,1,.3,1);
}
/* they arrive one after another, so the choice gets a beat before it is offered */
body.has-catch #plate .acts .act{opacity:1; transform:none;}
body.has-catch #plate .acts .act:nth-child(1){transition-delay:.10s;}
body.has-catch #plate .acts .act:nth-child(2){transition-delay:.18s;}
body.has-catch #plate .acts .act:nth-child(3){transition-delay:.26s;}

/* the same glass coin the tool rail is made of, scaled up for the moment */
#plate .acts .ic{
  width:clamp(2.45rem,10.6vw,3.35rem); height:clamp(2.45rem,10.6vw,3.35rem);
  border-radius:50%; display:grid; place-items:center; flex:0 0 auto;
  background:rgba(6,26,33,.5); border:1px solid rgba(226,242,244,.38);
  color:rgba(236,249,251,.92);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  box-shadow:0 10px 24px -14px rgba(1,12,16,.98);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.4), background .18s, border-color .18s,
             color .18s, box-shadow .18s;
}
#plate .acts svg{
  width:clamp(1.12rem,4.9vw,1.5rem); height:clamp(1.12rem,4.9vw,1.5rem); display:block;
  transition:transform .24s cubic-bezier(.2,.9,.3,1.4);
}
#plate .acts .vb{
  font-size:clamp(.72rem,2.5vw,.94rem); line-height:1.16; letter-spacing:-.01em;
  color:rgba(240,251,253,.95); text-shadow:0 2px 12px rgba(4,30,40,.85); text-wrap:balance;
}
#plate .acts .cost{
  font-family:var(--f-mono); font-size:clamp(.43rem,1.65vw,.53rem); letter-spacing:.15em;
  text-transform:uppercase; line-height:1.32; color:rgba(228,244,246,.74);
  text-shadow:0 1px 9px rgba(4,30,40,.96); transition:color .18s;
  margin-top:-.34rem;                    /* the price belongs to the verb above it */
}

/* keep it: the only one that ends with the fish still yours, so it is the solid
   one, and it wears the dex's own icon -- the corner it is about to fly to */
#plate .acts #keep .ic{
  background:rgba(233,247,250,.93); border-color:rgba(243,253,255,.95); color:#0B1E24;
  box-shadow:0 12px 26px -13px rgba(1,12,16,1);
}
#plate .acts #keep.fresh .cost{color:#FFD9A8;}
/* send it: warm, the way everything that leaves this page is warm */
#plate .acts #send .ic{background:rgba(255,196,154,.14); border-color:rgba(255,196,154,.62); color:#FFD9A8;}
#plate .acts #send .vb{color:rgba(255,224,196,.96);}
#plate .acts #send .cost{color:rgba(255,201,154,.76);}

#plate .acts .act:hover .ic{transform:translateY(-3px);}
#plate .acts #release:hover .ic{background:rgba(10,42,52,.82); border-color:rgba(255,255,255,.92); color:#fff;}
#plate .acts #keep:hover .ic{background:#fff; border-color:#fff;}
#plate .acts #send:hover .ic{background:#FFC49A; border-color:#FFC49A; color:#0B1E24;}
#plate .acts .act:hover .cost{color:rgba(255,255,255,.9);}
#plate .acts #send:hover .cost{color:#FFD9A8;}
/* the icon leans the way the fish is about to go */
#plate .acts #release:hover svg{transform:translateY(2.5px);}
#plate .acts #send:hover svg{transform:translate(2.5px,-2.5px);}
#plate .acts #keep:hover svg{transform:scale(1.07);}
#plate .acts .act:active .ic{transform:translateY(1px) scale(.94);}
#plate .acts .act:focus-visible{outline:none;}
#plate .acts .act:focus-visible .ic{outline:2px solid #FFD9A8; outline-offset:4px;}

/* the choice lands: the one you took flares, the two you did not fall away.
   fading all three to 40% opacity said "nothing happened" instead. */
body.has-catch #plate .acts .act.spent{
  opacity:0; transform:translateY(6px) scale(.92); pointer-events:none;
  transition:opacity .22s ease, transform .22s ease; transition-delay:0s;
}
#plate .acts .act.chosen{pointer-events:none;}
#plate .acts .act.chosen .ic{animation:actpick .38s cubic-bezier(.2,.9,.3,1.4);}
#plate .acts #release.chosen .ic{background:rgba(10,42,52,.82); border-color:rgba(255,255,255,.92); color:#fff;}
#plate .acts #keep.chosen .ic{background:#fff; border-color:#fff;}
#plate .acts #send.chosen .ic{background:#FFC49A; border-color:#FFC49A; color:#0B1E24;}
@keyframes actpick{0%{transform:none}38%{transform:scale(1.18)}100%{transform:none}}
#plate .acts .narrow{display:none;}

/* trying a choice on before you make it: each option lights its own destination,
   so the trade is visible while there is still time to change your mind */
#fish{transition:opacity .32s ease, transform .32s ease;}
body.hint-release #veil{opacity:.5;}
body.hint-release #rig{opacity:.44;}
body.hint-keep #dexbtn{color:#FFD9A8;}
body.hint-keep #dexbtn .lb{opacity:1; color:#FFD9A8;}
body.hint-keep #dexbtn .ic{background:rgba(255,196,154,.2); border-color:#FFD9A8; transform:translateY(-2px);}
body.hint-send #fish{opacity:.62; transform:translateX(14px);}

/* ---------------------------------------------------------------- clock */
#clockbox{
  position:fixed; right:clamp(1.1rem,3vw,2.2rem); top:clamp(1.05rem,2.7vw,2rem); z-index:9;
  text-align:right;
}
#clockline{display:flex; align-items:center; justify-content:flex-end; gap:.9rem;}
/* Make the time control the obvious invitation; weather is a quiet secondary
   control so it does not steal the sky's only useful affordance. */
#clock{
  padding:.55rem .7rem; border:0; border-radius:.35rem; background:none; font-family:var(--f-mono); line-height:1.3;
  text-align:right; cursor:pointer; text-shadow:0 1px 10px rgba(4,30,40,.9);
  transition:background .18s;
}
#clock b{
  display:block; font-weight:400; font-size:.9rem; letter-spacing:.13em;
  color:rgba(238,250,252,.94); font-variant-numeric:tabular-nums; transition:color .18s;
}
#clock .clock-cue{
  display:flex; justify-content:flex-end; margin-top:.18rem; color:rgba(238,250,252,.56);
  transition:color .18s;
}
#clock .clock-cue svg{width:1.05rem; height:.52rem; fill:none; stroke:currentColor; stroke-width:1.25; stroke-linecap:round;}
#clock:hover,#clock:focus-visible{background:rgba(6,26,33,.28);}
#clock:hover b,#clock:focus-visible b{color:#fff;}
#clock:hover .clock-cue,#clock:focus-visible .clock-cue,#clock[aria-expanded="true"] .clock-cue{color:var(--wx,#FFC49A);}
#clock[aria-expanded="true"] .clock-cue svg{transform:translateX(1px);}
#clock:focus-visible{outline:2px solid #FFD9A8; outline-offset:4px;}
#clock-w{
  width:1.85rem; height:1.85rem; display:grid; place-items:center; border-radius:50%;
  color:rgba(238,250,252,.48); background:transparent; border:1px solid transparent;
  box-shadow:none; opacity:.72;
  transition:transform .16s cubic-bezier(.16,1,.3,1),background .16s,border-color .16s,color .16s,opacity .16s;
}
#clock-w:hover,#clock-w:focus-visible{color:#fff; background:rgba(10,42,52,.62); border-color:rgba(226,242,244,.52); opacity:1; transform:translateY(-1px);}
#clock-w:active{transform:translateY(1px) scale(.94);}
#clock-w svg{width:1rem; height:1rem; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
@media (pointer:coarse){#clock-w{width:2.75rem; height:2.75rem;}}
#clock-w .wx{display:none;}
#clock-w[data-weather="dawn"] .wx-dawn,
#clock-w[data-weather="sunrise"] .wx-sunrise,
#clock-w[data-weather="day"] .wx-day,
#clock-w[data-weather="dusk"] .wx-dusk,
#clock-w[data-weather="night"] .wx-night,
#clock-w[data-weather="fog"] .wx-fog,
#clock-w[data-weather="rain"] .wx-rain{display:block;}
#time-reel{
  box-sizing:border-box; width:min(18rem,calc(100vw - 2.2rem)); margin-top:.65rem; padding:.7rem .8rem .6rem;
  color:rgba(238,250,252,.74); background:rgba(6,26,33,.82); border:1px solid rgba(226,242,244,.28);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); text-align:left;
  animation:reel-in .2s cubic-bezier(.16,1,.3,1);
}
#time-reel[hidden]{display:none;}
@keyframes reel-in{from{opacity:0; transform:translateY(-4px); clip-path:inset(0 0 100% 0)}to{opacity:1; transform:none; clip-path:inset(0)}}
.time-reel-head,.time-marks{display:flex; align-items:center; justify-content:space-between;}
.time-reel-head{
  margin-bottom:.55rem; font-family:var(--f-mono); font-size:.5rem; letter-spacing:.15em; text-transform:uppercase;
}
#time-choice{color:#fff; font-variant-numeric:tabular-nums;}
#time-range{
  width:100%; height:24px; margin:0 0 .2rem; appearance:none; -webkit-appearance:none; border:0;
  background:linear-gradient(90deg,#101a3d 0%,#775f87 20%,#a9d8e2 35%,#7ec8e3 62%,#cb6c70 80%,#101a3d 100%) center/100% 6px no-repeat; cursor:ew-resize;
}
#time-range:focus-visible{outline:2px solid #FFD9A8; outline-offset:3px;}
#time-range::-webkit-slider-thumb{
  width:24px; height:24px; appearance:none; -webkit-appearance:none; border:2px solid #fff; border-radius:50%;
  background:#FFD9A8; box-shadow:0 3px 10px rgba(1,12,16,.7); cursor:grab;
}
#time-range::-moz-range-thumb{
  width:20px; height:20px; border:2px solid #fff; border-radius:50%;
  background:#FFD9A8; box-shadow:0 3px 10px rgba(1,12,16,.7); cursor:grab;
}
.time-marks{font-family:var(--f-mono); font-size:.43rem; letter-spacing:.08em; text-transform:uppercase; color:rgba(238,250,252,.48);}
/* the hands have been turned: this is our hour now, not the machine's */
#clock.held b{color:var(--wx,#FFC49A);}
#clock-now{
  margin-top:.34rem; font-family:var(--f-mono); font-size:.5rem; letter-spacing:.2em;
  text-transform:uppercase; color:rgba(238,250,252,.5);
  text-shadow:0 1px 10px rgba(4,30,40,.92); transition:color .18s;
}
#clock-now:hover{color:rgba(238,250,252,.95);}

/* ---------------------------------------------------------------- tools */
#tools{
  position:fixed; right:clamp(1rem,3vw,2rem); bottom:clamp(1rem,3vh,2rem); z-index:9;
  display:flex; flex-direction:column; align-items:flex-end; gap:.5rem;
}
.tool{display:flex; align-items:center; gap:.65rem; color:rgba(238,250,252,.66);}
.tool .lb,.music-volume .lb{
  font-family:var(--f-mono); font-size:.56rem; letter-spacing:.17em; text-transform:uppercase;
  text-shadow:0 1px 10px rgba(4,30,40,.92); opacity:.6; transition:opacity .18s, color .18s;
  white-space:nowrap;
}
.tool .ic{
  width:2.7rem; height:2.7rem; border-radius:50%; display:grid; place-items:center; flex:0 0 auto;
  background:rgba(6,26,33,.42); border:1px solid rgba(226,242,244,.26);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.4), background .16s, border-color .16s, color .16s;
}
.tool svg{width:1.2rem; height:1.2rem; display:block;}
.tool:hover{color:#fff;}
.tool:hover .lb,.music-volume:hover .lb{opacity:1; color:#fff;}
.tool:hover .ic{background:rgba(10,42,52,.8); border-color:rgba(255,255,255,.9); transform:translateY(-2px);}
.tool:active .ic{transform:translateY(1px) scale(.94);}
.sound-control{position:relative; display:flex; align-items:center; justify-content:flex-end;}
.sound-control .music-volume{
  position:absolute; right:calc(100% + .65rem); z-index:2; display:flex; align-items:center; gap:.65rem;
  color:rgba(238,250,252,.66); opacity:0; pointer-events:none;
  transform:translateX(.65rem); transform-origin:right center;
  transition:opacity .18s ease, transform .24s cubic-bezier(.16,1,.3,1);
}
.sound-control:hover .music-volume,
.sound-control:focus-within .music-volume{
  opacity:1; pointer-events:auto; transform:translateX(0);
  transition-delay:0s;
}
.sound-control:hover .music-volume .lb,
.sound-control:focus-within .music-volume .lb{opacity:1; color:#fff;}
.sound-control:hover .tool .ic,
.sound-control:focus-within .tool .ic{background:rgba(10,42,52,.8); border-color:rgba(255,255,255,.9); transform:translateY(-2px);}
.sound-control .music-volume output{color:#FFD9A8; font-variant-numeric:tabular-nums;}
.sound-control .music-volume:hover .volume-shell,
.sound-control .music-volume:focus-within .volume-shell{background:rgba(10,42,52,.8); border-color:rgba(255,255,255,.72);}
.sound-control .tool{position:relative; z-index:1;}
.volume-shell{
  width:6.8rem; height:2.7rem; padding:0 .75rem; display:grid; place-items:center;
  background:rgba(6,26,33,.42); border:1px solid rgba(226,242,244,.26); border-radius:1.35rem;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:background .16s, border-color .16s, box-shadow .16s;
}
#musicvol{
  --volume:70%; width:100%; height:2px; margin:0; appearance:none; -webkit-appearance:none;
  border:0; border-radius:1px; cursor:pointer;
  background:linear-gradient(to right,#FFD9A8 var(--volume),rgba(226,242,244,.24) var(--volume));
}
#musicvol:focus-visible{outline:2px solid #FFD9A8; outline-offset:7px;}
#musicvol::-webkit-slider-thumb{
  width:16px; height:16px; border:1px solid rgba(11,30,36,.72); border-radius:50%;
  appearance:none; -webkit-appearance:none; background:#FFD9A8;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.4), box-shadow .16s;
}
#musicvol:hover::-webkit-slider-thumb,
#musicvol:focus-visible::-webkit-slider-thumb{transform:scale(1.15); box-shadow:0 0 0 4px rgba(255,217,168,.2);}
#musicvol::-moz-range-thumb{width:16px; height:16px; border:1px solid rgba(11,30,36,.72); border-radius:50%; background:#FFD9A8; transition:transform .16s cubic-bezier(.2,.9,.3,1.4), box-shadow .16s;}
#musicvol:hover::-moz-range-thumb,
#musicvol:focus-visible::-moz-range-thumb{transform:scale(1.15); box-shadow:0 0 0 4px rgba(255,217,168,.2);}
.tool.primary .ic{
  width:3.3rem; height:3.3rem; background:rgba(255,196,154,.14); border-color:rgba(255,196,154,.72);
  color:#FFD9A8;
}
.tool.primary .lb{color:rgba(255,217,168,.8); opacity:.85;}
.tool.primary:hover .ic{background:#FFC49A; border-color:#FFC49A; color:#0B1E24;}
.tool.primary svg{width:1.5rem; height:1.5rem;}
.tool.primary.casting .ic{animation:rodkick .5s ease;}
@keyframes rodkick{0%{transform:rotate(0)}30%{transform:rotate(-22deg) scale(1.06)}100%{transform:rotate(0)}}
.tool.pop .ic{animation:dexpop .55s cubic-bezier(.2,.9,.3,1.4);}
.tool.pop{color:#FFC49A;}
@keyframes dexpop{0%{transform:scale(1)}34%{transform:scale(1.3)}100%{transform:scale(1)}}
#snd[aria-pressed="false"]{color:rgba(238,250,252,.34);}
#snd[aria-pressed="false"] .ic{border-color:rgba(226,242,244,.14); border-style:dashed;}
#snd:focus-visible .ic{outline:2px solid #FFD9A8; outline-offset:4px;}
#snd .on,#snd .off{display:none;}
#snd[aria-pressed="true"] .on{display:block;}
#snd[aria-pressed="false"] .off{display:block;}
#dexn,#radionm{font-style:normal; color:#FFD9A8;}

#foot{
  position:fixed; left:50%; transform:translateX(-50%); bottom:clamp(1.1rem,3vh,2rem); z-index:6;
  font-family:var(--f-mono); font-size:.72rem; letter-spacing:.13em; text-transform:uppercase;
  white-space:nowrap; text-shadow:0 1px 10px rgba(4,30,40,.85); pointer-events:none;
  max-width:min(64vw,30rem); overflow:hidden; text-overflow:ellipsis;
}
#foot b{font-weight:400; color:rgba(238,250,252,.95);}
#versionbox{
  position:fixed; left:clamp(1.1rem,3vw,2.2rem); bottom:clamp(4.3rem,8vh,5.15rem); z-index:9;
  font-family:var(--f-mono); font-size:.56rem; letter-spacing:.15em; text-transform:uppercase;
  text-shadow:0 1px 10px rgba(4,30,40,.9);
}
#version,#src{
  box-sizing:border-box; min-height:2.75rem; display:flex; align-items:center; gap:.45rem; padding:.65rem .8rem;
  color:rgba(238,250,252,.88); background:rgba(6,26,33,.62); border:1px solid rgba(226,242,244,.34);
  border-radius:1.4rem; cursor:pointer; text-decoration:none; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:color .18s,background .18s,border-color .18s,transform .12s;
}
#version{list-style:none;}
#version::-webkit-details-marker{display:none;}
#version svg,#src svg{width:.85rem; height:.85rem; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
#version svg{transition:transform .18s;}
#version b{font-weight:400; color:#FFD9A8;}
#version:hover,#src:hover,#versionbox[open] #version{color:#fff; background:rgba(6,26,33,.78); border-color:rgba(255,217,168,.72);}
#versionbox[open] #version svg{transform:rotate(180deg);}
#version:active,#src:active{transform:translateY(1px);}
#history{
  position:absolute; left:0; bottom:3.35rem; width:min(32rem,calc(100vw - 2.2rem)); max-height:min(70vh,32rem);
  display:flex; flex-direction:column; background:rgba(6,26,33,.96); border:1px solid rgba(226,242,244,.28);
  box-shadow:0 24px 60px -24px rgba(1,12,16,.96); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  text-transform:none; letter-spacing:normal;
}
#history header{display:flex; justify-content:space-between; gap:1rem; padding:.8rem .9rem .7rem;
  border-bottom:1px solid rgba(226,242,244,.14); font-size:.58rem; letter-spacing:.14em; text-transform:uppercase;}
#history header b{font-weight:400; color:#fff;}
#history header span{color:rgba(226,242,244,.62); white-space:nowrap;}
#history ol{margin:0; padding:0; overflow-y:auto; list-style:none; counter-reset:commits;}
#history li{counter-increment:commits; border-bottom:1px solid rgba(226,242,244,.1);}
#history li:last-child{border-bottom:0;}
#history li a{display:grid; grid-template-columns:1.5rem 5.2rem 4.1rem minmax(0,1fr); gap:.55rem; align-items:baseline;
  padding:.7rem .9rem; color:rgba(238,250,252,.82); text-decoration:none; line-height:1.35; transition:background .15s,color .15s;}
#history li a::before{content:counter(commits); color:rgba(226,242,244,.4);}
#history time,#history code{font-family:var(--f-mono); font-size:.55rem; color:rgba(226,242,244,.62);}
#history code{color:#FFD9A8; text-decoration:underline; text-underline-offset:3px;}
#history li span{overflow-wrap:anywhere;}
#history li a:hover,#history li a:focus-visible{color:#fff; background:rgba(255,217,168,.1);}
#src{
  position:fixed; left:clamp(1.1rem,3vw,2.2rem); bottom:clamp(1.15rem,3vh,2.05rem); z-index:9;
  width:max-content; font-family:var(--f-mono); font-size:.56rem; letter-spacing:.18em; text-transform:uppercase;
  text-shadow:0 1px 10px rgba(4,30,40,.9);
}

/* the catch, printed as a card and thrown to whoever you sent it to */
#card{
  position:fixed; z-index:12; pointer-events:none; left:0; top:0; transform-origin:50% 50%;
  box-shadow:0 30px 60px -24px rgba(0,0,0,.95); border:2px solid rgba(255,255,255,.85);
}
/* on a phone the corner stack turns into a row along the bottom edge, and
   everything else moves up out of its way */
@media (max-width:560px){
  #tools{flex-direction:row; align-items:center; gap:.45rem; bottom:1rem; right:1rem;}
  .tool .lb,.music-volume .lb{display:none;}
  .tool .ic{width:2.5rem; height:2.5rem;}
  .sound-control .music-volume{
    right:0; bottom:calc(100% + .45rem); transform:translateY(.65rem); transform-origin:center bottom;
  }
  .sound-control:hover .music-volume,
  .sound-control:focus-within .music-volume{transform:translateY(0);}
  .volume-shell{width:3.75rem; height:2.5rem; padding:0 .55rem;}
  .tool.primary .ic{width:3rem; height:3rem;}
  #src{bottom:1.5rem; left:1rem;}
  #foot{font-size:.6rem; bottom:8rem; max-width:88vw;}
  #plate{bottom:9.8rem; width:min(96vw,34rem);}
  #plate .acts{margin-top:.85rem;}
  #plate .acts .act{gap:.36rem;}
  #plate .acts .wide{display:none;}
  #plate .acts .narrow{display:inline;}
  #plate .nm{font-size:clamp(1.7rem,7vw,2.4rem);}
  #plate .sub{font-size:.62rem;}
}

#drop{
  position:fixed; inset:clamp(.6rem,2vw,1.4rem); z-index:7; pointer-events:none;
  border:2px dashed rgba(255,255,255,.85); opacity:0; transition:opacity .18s;
  display:grid; place-items:center;
}
#drop.on{opacity:1;}
#drop span{
  font-family:var(--f-mono); font-size:.78rem; letter-spacing:.2em; text-transform:uppercase;
  background:rgba(6,28,36,.5); padding:.9rem 1.5rem;
}
/* ---------------------------------------------------------------- dex */
#dex{
  position:fixed; inset:0; z-index:20; display:grid; place-items:center;
  grid-template-rows:minmax(0,1fr);   /* definite row, or max-height:100% is circular */
  padding:clamp(.6rem,3vh,2rem); background:rgba(4,18,24,.72);
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  animation:dexin .22s ease;
}
@keyframes dexin{from{opacity:0}to{opacity:1}}
#dex[hidden]{display:none;}
#dex-panel{
  width:min(100%,58rem); max-height:100%; display:flex; flex-direction:column;
  background:rgba(9,28,35,.94); border:1px solid rgba(190,230,236,.18);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.9);
}
#dex-panel header{
  flex:0 0 auto; display:flex; align-items:center; gap:1.4rem; padding:1rem 1.2rem .9rem;
  border-bottom:1px solid rgba(190,230,236,.14);
}
#dex-panel h2{margin:0; font-size:1.25rem; font-weight:500; letter-spacing:-.01em; line-height:1;}
#dex-panel header>div:first-child{flex:1; min-width:0;}
.bar{margin-top:.5rem; height:3px; background:rgba(190,230,236,.14); max-width:22rem;}
.bar i{display:block; height:100%; width:0; background:#FFC49A; transition:width .4s ease;}
#dex-panel .count{
  font-family:var(--f-mono); font-size:.68rem; letter-spacing:.13em; text-transform:uppercase;
  color:rgba(226,242,244,.55); white-space:nowrap;
}
#dex-panel .count b{font-weight:400; color:#FFC49A;}
#dex-close{
  font-family:var(--f-mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
  color:rgba(226,242,244,.5); border:1px solid rgba(190,230,236,.24); padding:.35rem .55rem;
}
#dex-close:hover{color:#fff; border-color:#fff;}

#dex-groups{flex:1 1 auto; min-height:0; overflow-y:auto; padding:1rem 1.2rem 1.2rem;
  display:flex; flex-direction:column; gap:1.1rem;}
.grp h3{
  margin:0 0 .45rem; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.2em;
  text-transform:uppercase; color:rgba(226,242,244,.42); font-weight:400;
}
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:6px;}
.slot{
  position:relative; aspect-ratio:4/3; border:1px solid rgba(190,230,236,.13);
  background:rgba(3,14,18,.55); display:grid; place-items:center; overflow:hidden;
  transition:border-color .16s, background .16s;
}
.slot img{width:100%; height:100%; object-fit:contain; image-rendering:pixelated;}
.slot.locked::after{
  content:"?"; font-family:var(--f-mono); font-size:.9rem; color:rgba(190,230,236,.16);
}
.slot.got{cursor:pointer; background:rgba(20,52,62,.5);}
.slot.got:hover,.slot.sel{border-color:#FFC49A;}
.slot.sel{background:rgba(48,32,26,.6);}
.slot .dot{
  position:absolute; right:4px; top:4px; width:5px; height:5px; border-radius:50%;
  background:rgba(226,242,244,.35);
}
.slot .dot.r2{background:#7FD6C4;} .slot .dot.r3{background:#8AB6FF;}
.slot .dot.r4{background:#C79BFF;} .slot .dot.r5{background:#FFC24A;}
.slot.fresh{animation:pop .5s ease;}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}

#dex-detail{
  flex:0 0 auto; border-top:1px solid rgba(190,230,236,.14); padding:.8rem 1.2rem;
  font-family:var(--f-mono); font-size:.7rem; letter-spacing:.06em;
  color:rgba(226,242,244,.62); min-height:3.4rem;
}
#dex-detail .nm{font-family:var(--f-display); font-size:1.05rem; letter-spacing:0; color:#fff; margin-bottom:.2rem;}
#dex-detail .nm em{font-style:normal; font-size:.6rem; font-family:var(--f-mono); letter-spacing:.2em; text-transform:uppercase; color:#FFC49A; margin-left:.6rem;}
#dex-detail .empty{color:rgba(226,242,244,.3);}
#dex-detail .done{color:#FFC49A;}
@media (max-width:560px){
  .slots{grid-template-columns:repeat(auto-fill,minmax(58px,1fr));}
  #dex-panel header{gap:.8rem;}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms !important; animation:none !important;}
  /* a stagger with no duration is just three late arrivals */
  #plate .acts .act{transition-delay:0s !important;}
}
</style>

  <div id="veil"></div>

<div class="mark">file<i>to</i>fish</div>

<div id="clockbox">
  <div id="clockline">

    </button>
    <button id="clock-w" type="button" data-weather="day" aria-label="Weather: clear. Change weather" title="change weather: clear">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="wx wx-dawn"><path d="M4 18h16M7 14h10M12 5v3M6.8 9.2l2 2M17.2 9.2l-2 2"/><path d="M8 14a4 4 0 0 1 8 0"/></g>
        <g class="wx wx-sunrise"><path d="M3 18h18M6 14h12M12 4v3M5.6 8.6l2.1 2.1M18.4 8.6l-2.1 2.1"/><path d="M8 14a4 4 0 0 1 8 0"/></g>
        <g class="wx wx-day"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></g>
        <g class="wx wx-dusk"><path d="M3 17h18M6 13h12M12 20v-2M5.6 8.6l2.1 2.1M18.4 8.6l-2.1 2.1"/><path d="M8 13a4 4 0 0 1 8 0"/></g>
        <g class="wx wx-night"><path d="M18.5 15.4A7 7 0 0 1 8.6 5.5a7.5 7.5 0 1 0 9.9 9.9Z"/><path d="M17.5 4v3M16 5.5h3"/></g>
        <g class="wx wx-fog"><path d="M4 8h13M7 12h13M4 16h13"/></g>
        <g class="wx wx-rain"><path d="M7 15h10a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.4 1.5A3.3 3.3 0 0 0 7 15Z"/><path d="m8 18-1 2M12 18l-1 2M16 18l-1 2"/></g>
      </svg>
    </button>
  </div>
  <div id="time-reel" hidden>
    <div class="time-reel-head"><span>one swipe = one day</span><output id="time-choice">--:--</output></div>
    <input id="time-range" type="range" min="0" max="1439" step="1" aria-label="Time of day">
    <div class="time-marks" aria-hidden="true"><span>midnight</span><span>dawn</span><span>noon</span><span>dusk</span><span>midnight</span></div>
  </div>
  <button id="clock-now" type="button" hidden title="give the clock back to your machine">back to now</button>
</div>

<div id="plate">
  <div class="rar" id="p-rar"></div>
  <div class="nm" id="p-nm"></div>
  <div class="sub" id="p-sub"></div>
  <div class="acts" role="group" aria-label="what happens to this fish">
    <button id="release" class="act" type="button">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
        <path d="M2.6 6.2c2.1-1.5 4.2-1.5 6.3 0s4.2 1.5 6.3 0 4.2-1.5 6.2 0"/>
        <path d="M12 10.4v7.4"/>
        <path d="m8.5 14.3 3.5 3.5 3.5-3.5"/>
      </svg></span>
      <span class="vb">put it back</span>
      <span class="cost">nothing kept</span>
    </button>
    <button id="keep" class="act" type="button">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
        <path d="M12 7.1C10.1 5.2 7.4 4.4 3.6 4.6v12.9c3.8-.2 6.5.6 8.4 2.5 1.9-1.9 4.6-2.7 8.4-2.5V4.6c-3.8-.2-6.5.6-8.4 2.5z"/>
        <path d="M12 7.1V20"/>
        <path d="M6.3 8.6h2.9M6.3 11.6h2.9M14.8 8.6h2.9M14.8 11.6h2.9"/>
      </svg></span>
      <span class="vb">keep it</span>
      <span class="cost" id="keep-cost">yours to look at</span>
    </button>
    <button id="send" class="act" type="button">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
        <path d="M2.6 18.4c2.1-1.5 4.2-1.5 6.3 0s4.2 1.5 6.3 0 4.2-1.5 6.2 0"/>
        <path d="M5.6 15.8 17.4 4.6"/>
        <path d="M9.7 4.6h7.7v7.3"/>
      </svg></span>
      <span class="vb"><span class="wide">send it to a friend</span><span class="narrow">send it</span></span>
      <span class="cost">theirs &#183; not yours</span>
    </button>
  </div>
</div>
