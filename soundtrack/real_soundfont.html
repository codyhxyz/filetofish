<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real SoundFont & Multi-Sample Test (FluidR3 GM)</title>
  <style>
    body {
      background: #0d1217;
      color: #e4edf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: #16202c;
      border: 1px solid #283a4e;
      border-radius: 16px;
      padding: 32px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: #58a6ff;
    }
    p {
      color: #8da4b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .status {
      background: #0e151e;
      border: 1px solid #202d3c;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #79c0ff;
      margin-bottom: 20px;
    }
    button {
      background: #238636;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #334455; cursor: not-allowed; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
</head>
<body>
  <div class="box">
    <h1>🎼 True Multi-Sampled SoundFont (FluidR3 GM)</h1>
    <p>Zero mathematical synthesis. Zero synthetic LFO tremolo. Real studio-recorded acoustic instrument samples: acoustic bass, orchestral marimba, nylon guitar, and concert flute.</p>
    <div class="status" id="status">Click below to load real instrument samples & play...</div>
    <button id="playBtn" onclick="togglePlay()">▶ Load & Play Real SoundFont</button>
  </div>

  <script>
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    let isPlaying = false;
    let timer = null;
    let bassInst, marimbaInst, guitarInst, fluteInst;
    const statusEl = document.getElementById('status');
    const playBtn = document.getElementById('playBtn');

    const BPM = 92;
    const BEAT = 60 / BPM;
    const SWING = 0.62;

    function swingBeat(b) {
      const whole = Math.floor(b);
      const frac = b - whole;
      if (frac === 0) return whole;
      if (Math.abs(frac - 0.5) < 0.05) return whole + SWING;
      return whole + frac;
    }

    const CHORDS = [
      { bass: "C2", notes: ["E4", "G4", "B4", "D5"] }, // Cmaj9
      { bass: "A1", notes: ["Db4", "E4", "G4", "Bb4"] }, // A7b9
      { bass: "D2", notes: ["F4", "A4", "C5", "E5"] }, // Dm9
      { bass: "G1", notes: ["E4", "F4", "B4", "D5"] }, // G13
      { bass: "E2", notes: ["G4", "B4", "D5", "G5"] }, // Em7
      { bass: "A1", notes: ["Db4", "G4", "A4", "E5"] }, // A7
      { bass: "F1", notes: ["A4", "C5", "E5", "G5"] }, // Fmaj7
      { bass: "F1", notes: ["Ab4", "C5", "D5", "G5"] }, // Fm6 (bittersweet AC IVm)
    ];

    const MELODY = [
      { bar: 0, beat: 0.0, note: "E5", dur: 0.8 },
      { bar: 0, beat: 1.0, note: "G5", dur: 0.6 },
      { bar: 0, beat: 2.0, note: "D5", dur: 0.8 },
      { bar: 0, beat: 3.0, note: "C5", dur: 1.8 },
      { bar: 1, beat: 2.5, note: "B4", dur: 0.5 },
      { bar: 1, beat: 3.0, note: "C5", dur: 0.9 },
      // Negative space in bars 2-3
      { bar: 3, beat: 2.5, note: "D5", dur: 0.5 },
      { bar: 3, beat: 3.0, note: "E5", dur: 0.7 },
      { bar: 4, beat: 0.0, note: "G5", dur: 0.8 },
      { bar: 4, beat: 1.0, note: "A5", dur: 0.6 },
      { bar: 4, beat: 2.0, note: "B5", dur: 1.2 },
      { bar: 5, beat: 0.5, note: "A5", dur: 0.6 },
      { bar: 5, beat: 1.5, note: "G5", dur: 0.6 },
      { bar: 5, beat: 2.5, note: "E5", dur: 1.6 },
      { bar: 6, beat: 0.0, note: "E5", dur: 1.2 },
      { bar: 6, beat: 2.0, note: "F5", dur: 0.8 },
      { bar: 7, beat: 0.0, note: "F5", dur: 1.0 },
      { bar: 7, beat: 2.0, note: "Eb5", dur: 1.5 }, // Eb5 over Fm6
    ];

    async function loadInstruments() {
      statusEl.textContent = "Loading real FluidR3 soundfont audio recordings...";
      playBtn.disabled = true;

      // Load true recorded audio soundfonts
      const soundfontOpts = { soundfont: "FluidR3_GM" };
      [bassInst, marimbaInst, guitarInst, fluteInst] = await Promise.all([
        Soundfont.instrument(ac, "acoustic_bass", soundfontOpts),
        Soundfont.instrument(ac, "marimba", soundfontOpts),
        Soundfont.instrument(ac, "acoustic_guitar_nylon", soundfontOpts),
        Soundfont.instrument(ac, "flute", soundfontOpts),
      ]);

      playBtn.disabled = false;
      statusEl.textContent = "✓ Real instruments loaded. Ready!";
    }

    function scheduleLoop() {
      if (!isPlaying) return;
      const now = ac.currentTime + 0.05;
      const numBars = CHORDS.length;

      CHORDS.forEach((c, bar) => {
        const tBar = now + bar * 4 * BEAT;
        // Real Acoustic Bass (stable pitch, real wooden body)
        bassInst.play(c.bass, tBar, { duration: BEAT * 1.5, gain: 1.2 });
        bassInst.play(c.bass.replace(/\d/, (d) => parseInt(d) + 1), tBar + 2 * BEAT, { duration: BEAT * 1.2, gain: 0.9 });

        // Real Nylon Guitar & Marimba comping
        const tStab1 = tBar + swingBeat(0.5) * BEAT;
        const tStab2 = tBar + swingBeat(2.5) * BEAT;
        c.notes.forEach((n) => {
          guitarInst.play(n, tStab1, { duration: BEAT * 1.0, gain: 0.45 });
          marimbaInst.play(n, tStab2, { duration: BEAT * 0.8, gain: 0.40 });
        });
      });

      // Real Flute Lead (Zero synthetic vibrato wobble)
      MELODY.forEach((m) => {
        const tNote = now + (m.bar * 4 + swingBeat(m.beat)) * BEAT;
        fluteInst.play(m.note, tNote, { duration: m.dur * BEAT, gain: 0.8 });
      });

      const loopLen = numBars * 4 * BEAT * 1000;
      timer = setTimeout(scheduleLoop, loopLen - 100);
    }

    async function togglePlay() {
      if (ac.state === "suspended") await ac.resume();

      if (!bassInst) {
        await loadInstruments();
      }

      if (!isPlaying) {
        isPlaying = true;
        playBtn.textContent = "⏸ Pause Playback";
        statusEl.textContent = "▶ Playing true sampled acoustic instruments (Zero LFO vibrato)";
        scheduleLoop();
      } else {
        isPlaying = false;
        clearTimeout(timer);
        playBtn.textContent = "▶ Resume Playback";
        statusEl.textContent = "Paused";
      }
    }
  </script>
</body>
</html>
