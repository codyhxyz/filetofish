<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FiletoFish — Dock OST MVP Preview</title>
  <style>
    body {
      background: #141c24;
      color: #e0e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1c2733;
      border: 1px solid #2e3e50;
      border-radius: 12px;
      padding: 28px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }
    p {
      color: #8c9eb0;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    audio {
      width: 100%;
      outline: none;
      border-radius: 6px;
    }
    .badges {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .badge {
      background: #253342;
      color: #72b5f8;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 100px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎣 FiletoFish — Dock OST MVP</h1>
    <p>Animal Crossing-style daytime dock sketch. Swung walking bass, 2-op FM marimba, breathy whistle melody with negative space, and bittersweet IVm harmonic shift.</p>
    <audio controls loop autoplay src="previews/dock_mvp.wav"></audio>
    <div class="badges">
      <span class="badge">92 BPM Swung</span>
      <span class="badge">Jazz ii-V-I + IVm</span>
      <span class="badge">FM Marimba</span>
      <span class="badge">Negative Space</span>
    </div>
  </div>
</body>
</html>
