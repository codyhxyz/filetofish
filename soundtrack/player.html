<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FiletoFish — Animal Crossing & K.K. Slider Jukebox (26 Styles)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1217;
      color: #e4edf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 32px 20px 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
    }
    header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid #1f2b37;
      padding-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sub {
      color: #7e94a8;
      font-size: 14px;
      margin-top: 4px;
    }
    /* Sticky Player Bar */
    .player-card {
      position: sticky;
      top: 16px;
      z-index: 100;
      background: #16202c;
      border: 1px solid #28394b;
      border-radius: 14px;
      padding: 18px 24px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }
    .now-playing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .now-title {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
    }
    .now-meta {
      font-size: 13px;
      color: #8da4b8;
    }
    audio {
      width: 100%;
      height: 40px;
      outline: none;
      border-radius: 8px;
    }
    /* Category Filter Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: #17222e;
      border: 1px solid #273747;
      color: #9ab0c2;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab-btn:hover {
      background: #202e3d;
      color: #fff;
    }
    .tab-btn.active {
      background: #2564a8;
      border-color: #388bfd;
      color: #fff;
    }
    /* Track Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .track-card {
      background: #141d27;
      border: 1px solid #202c3a;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .track-card:hover {
      background: #1c2836;
      border-color: #314457;
      transform: translateY(-2px);
    }
    .track-card.active {
      background: #17324c;
      border-color: #388bfd;
    }
    .track-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .track-name {
      font-size: 14px;
      font-weight: 600;
      color: #f0f6fc;
      line-height: 1.3;
    }
    .track-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 100px;
      background: #202e3d;
      color: #79c0ff;
      font-weight: 500;
      white-space: nowrap;
    }
    .track-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #71889c;
    }
    .play-icon {
      font-size: 16px;
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🎣 FiletoFish — K.K. Slider & AC Jukebox</h1>
        <div class="sub">26 custom-synthesized genre prototypes + 6 time-of-day dock suite tracks</div>
      </div>
    </header>

    <!-- Sticky Audio Player -->
    <div class="player-card">
      <div class="now-playing-header">
        <span class="now-title" id="nowTitle">Select a track below</span>
        <span class="now-meta" id="nowMeta">0:00 / 0:00</span>
      </div>
      <audio id="audio" controls autoplay></audio>
    </div>

    <!-- Category Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab-btn active" onclick="filterCategory('All', this)">All (26)</button>
      <button class="tab-btn" onclick="filterCategory('Tropical & Island', this)">🏝 Tropical & Island (5)</button>
      <button class="tab-btn" onclick="filterCategory('Vintage & Retro', this)">📻 Vintage & Retro (5)</button>
      <button class="tab-btn" onclick="filterCategory('Maritime & Folk', this)">⚓ Maritime & Folk (4)</button>
      <button class="tab-btn" onclick="filterCategory('Electronic & Chill', this)">🌆 Electronic & Chill (5)</button>
      <button class="tab-btn" onclick="filterCategory('Atmospheric & Ambient', this)">🌌 Ambient & Lullaby (4)</button>
      <button class="tab-btn" onclick="filterCategory('World & Regional', this)">🌍 World & Regional (3)</button>
      <button class="tab-btn" onclick="filterCategory('Time of Day Suite', this)">🌅 Time of Day Suite (6)</button>
    </div>

    <!-- Tracks Grid -->
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const nowTitle = document.getElementById('nowTitle');
    const nowMeta = document.getElementById('nowMeta');
    const grid = document.getElementById('grid');

    let currentCategory = 'All';
    let activeTrackSlug = null;
    let catalog = [];

    const TOD_SUITE = [
      { slug: "ac_dawn", title: "1. Dawn (05:00-08:00)", category: "Time of Day Suite", bpm: 78, meter: "3/4", duration: "39.4s", path: "previews/ac_dawn.wav", badge: "Kalimba & Flute" },
      { slug: "ac_morning", title: "2. Morning (08:00-11:00)", category: "Time of Day Suite", bpm: 98, meter: "4/4", duration: "41.7s", path: "previews/ac_morning.wav", badge: "Slap Bass & Melodica" },
      { slug: "ac_day", title: "3. Day (11:00-17:00)", category: "Time of Day Suite", bpm: 92, meter: "4/4", duration: "44.2s", path: "previews/ac_day.wav", badge: "FM Marimba & Whistle" },
      { slug: "ac_sunset", title: "4. Sunset (17:00-20:00)", category: "Time of Day Suite", bpm: 76, meter: "4/4", duration: "53.0s", path: "previews/ac_sunset.wav", badge: "Rhodes & Vibraphone" },
      { slug: "ac_night", title: "5. Night (20:00-00:00)", category: "Time of Day Suite", bpm: 66, meter: "4/4", duration: "60.7s", path: "previews/ac_night.wav", badge: "Vibraphone & Glass" },
      { slug: "ac_late-night", title: "6. Late Night (00:00-05:00)", category: "Time of Day Suite", bpm: 56, meter: "4/4", duration: "71.6s", path: "previews/ac_late-night.wav", badge: "Music Box & Ticking" }
    ];

    async function init() {
      try {
        const res = await fetch('previews/kk_catalog.json');
        const kkData = await res.json();
        catalog = [...kkData, ...TOD_SUITE];
      } catch (e) {
        console.error(e);
        catalog = TOD_SUITE;
      }
      renderGrid();
      // Start with first track
      if (catalog.length > 0) {
        selectTrack(catalog[0]);
      }
    }

    function renderGrid() {
      grid.innerHTML = '';
      const filtered = catalog.filter(t => currentCategory === 'All' || t.category === currentCategory);

      filtered.forEach(t => {
        const card = document.createElement('div');
        card.className = `track-card ${t.slug === activeTrackSlug ? 'active' : ''}`;
        card.onclick = () => selectTrack(t);

        card.innerHTML = `
          <div class="track-top">
            <div class="track-name">${t.title}</div>
            <div class="track-badge">${t.badge || t.category}</div>
          </div>
          <div class="track-bottom">
            <span>${t.bpm} BPM · ${t.meter}</span>
            <span class="play-icon">▶ ${t.duration}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function selectTrack(track) {
      activeTrackSlug = track.slug;
      nowTitle.textContent = `▶ ${track.title}`;
      nowMeta.textContent = `${track.category} · ${track.bpm} BPM · ${track.meter} (${track.duration})`;
      audio.src = track.path.replace(/^soundtrack\//, '');
      audio.play().catch(() => {});
      renderGrid();
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderGrid();
    }

    init();
  </script>
</body>
</html>
