<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FiletoFish — Animal Crossing OST Suite</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f151c;
      color: #e2ebf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: #17212b;
      border: 1px solid #283747;
      border-radius: 16px;
      padding: 28px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sub {
      color: #8298ad;
      font-size: 14px;
      margin: 0 0 20px 0;
      line-height: 1.4;
    }
    audio {
      width: 100%;
      margin: 12px 0 20px 0;
      outline: none;
    }
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .track-btn {
      background: #1f2d3a;
      border: 1px solid #2c3e50;
      border-radius: 10px;
      padding: 12px 16px;
      color: #d0dde8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s ease;
      text-align: left;
    }
    .track-btn:hover {
      background: #273849;
      border-color: #3b536b;
      color: #fff;
    }
    .track-btn.active {
      background: #1d4469;
      border-color: #388bfd;
      color: #fff;
    }
    .meta {
      font-size: 12px;
      color: #7993ab;
      font-weight: normal;
    }
    .now-playing {
      font-size: 13px;
      color: #58a6ff;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .album-btn {
      width: 100%;
      padding: 12px;
      background: #238636;
      border: none;
      color: white;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .album-btn:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎣 FiletoFish — Animal Crossing OST Suite</h1>
    <div class="sub">Six time-of-day dock tracks with swung grooves, authentic FM synthesis, jazz cadences, and generous negative space.</div>

    <div class="now-playing" id="nowPlaying">Selected: Full Suite Album</div>
    <audio id="audio" controls autoplay src="previews/ac_suite_album.wav"></audio>

    <div class="track-list">
      <button class="track-btn" onclick="playTrack('previews/ac_dawn.wav', '1. Dawn (05:00-08:00)', '78 BPM Waltz · D Maj · Kalimba & Flute', this)">
        <span>🌅 1. Dawn (05:00–08:00)</span>
        <span class="meta">78 BPM · 3/4 Waltz · Kalimba/Flute</span>
      </button>

      <button class="track-btn" onclick="playTrack('previews/ac_morning.wav', '2. Morning (08:00-11:00)', '98 BPM Shuffle · G Maj · Slap Bass & Melodica', this)">
        <span>☕ 2. Morning (08:00–11:00)</span>
        <span class="meta">98 BPM · 4/4 Shuffle · Slap/Melodica</span>
      </button>

      <button class="track-btn" onclick="playTrack('previews/ac_day.wav', '3. Day (11:00-17:00)', '92 BPM Bossa · C Maj · FM Marimba & Whistle', this)">
        <span>☀️ 3. Day (11:00–17:00)</span>
        <span class="meta">92 BPM · 4/4 Bossa · FM Marimba/Whistle</span>
      </button>

      <button class="track-btn" onclick="playTrack('previews/ac_sunset.wav', '4. Sunset (17:00-20:00)', '76 BPM Bossa · F Maj · Warm Rhodes & Vibe', this)">
        <span>🌇 4. Sunset (17:00–20:00)</span>
        <span class="meta">76 BPM · 4/4 Bossa · Rhodes/Vibe</span>
      </button>

      <button class="track-btn" onclick="playTrack('previews/ac_night.wav', '5. Night (20:00-00:00)', '66 BPM Lounge · E Maj · Vibraphone & Glass', this)">
        <span>🌙 5. Night (20:00–00:00)</span>
        <span class="meta">66 BPM · 4/4 Lounge · Vibraphone/Glass</span>
      </button>

      <button class="track-btn" onclick="playTrack('previews/ac_late-night.wav', '6. Late Night (00:00-05:00)', '56 BPM Ambient · B Min · Chimes & Clock Tick', this)">
        <span>🌌 6. Late Night (00:00–05:00)</span>
        <span class="meta">56 BPM · 4/4 Ambient · Clock/Kalimba</span>
      </button>
    </div>

    <button class="album-btn" onclick="playTrack('previews/ac_suite_album.wav', 'Full Suite Album (All 6 Tracks)', 'Sequential 5-minute showcase', this)">
      ▶ Play Full Suite Album (5m 10s)
    </button>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const label = document.getElementById('nowPlaying');

    function playTrack(src, name, meta, el) {
      document.querySelectorAll('.track-btn, .album-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      label.textContent = `Playing: ${name} (${meta})`;
      audio.src = src;
      audio.play();
    }
  </script>
</body>
</html>
